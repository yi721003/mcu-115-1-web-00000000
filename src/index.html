<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>電子商城</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.min.css" />
  </head>
  <body>
    <section>
      <header>
        <div class="container">
          <div class="header-inner">
            <div class="header-brand">
              <h3 class="site-title">電子商城</h3>
              <nav>
                <a href="#">首頁</a>
                <a href="#">最新上架</a>
                <a href="#">暢銷排行</a>
                <a href="#">主題專區</a>
                <a href="#">會員中心</a>
              </nav>
            </div>
            <div class="header-actions">
              <label for="book-search">查詢</label>
              <div class="search">
                <input id="book-search" type="search" placeholder="查詢書名、作者..." />
                <button type="button" aria-label="搜尋">
                  <span class="material-symbols-outlined" aria-hidden="true">search</span>
                </button>
              </div>
              <button type="button" aria-label="我的最愛">
                <span class="material-symbols-outlined" aria-hidden="true">favorite</span>
              </button>
              <button type="button" aria-label="購物車">
                <span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span>
              </button>
            </div>
          </div>
        </div>
      </header>
      <div class="main">
        <div class="container">
          <div class="content-layout">
            <aside class="category-sidebar">
              <h2 id="category-title">書籍分類</h2>
              <nav class="category-nav" aria-labelledby="category-title">
                <a href="#" class="active" aria-current="true">
                  <span class="material-symbols-outlined" aria-hidden="true">auto_stories</span>
                  <span>文學小說</span>
                </a>
                <a href="#">
                  <span class="material-symbols-outlined" aria-hidden="true">paid</span>
                  <span>商業理財</span>
                </a>
                <a href="#">
                  <span class="material-symbols-outlined" aria-hidden="true">palette</span>
                  <span>藝術設計</span>
                </a>
                <a href="#">
                  <span class="material-symbols-outlined" aria-hidden="true">groups</span>
                  <span>人文社科</span>
                </a>
                <a href="#">
                  <span class="material-symbols-outlined" aria-hidden="true">psychology</span>
                  <span>心理勵志</span>
                </a>
                <a href="#">
                  <span class="material-symbols-outlined" aria-hidden="true">escalator_warning</span>
                  <span>親子教養</span>
                </a>
                <a href="#">
                  <span class="material-symbols-outlined" aria-hidden="true">cottage</span>
                  <span>生活風格</span>
                </a>
                <a href="#">
                  <span class="material-symbols-outlined" aria-hidden="true">language</span>
                  <span>語言學習</span>
                </a>
                <a href="#">
                  <span class="material-symbols-outlined" aria-hidden="true">school</span>
                  <span>考試參考書</span>
                </a>
                <a href="#">
                  <span class="material-symbols-outlined" aria-hidden="true">history_edu</span>
                  <span>童書/青少年文學</span>
                </a>
              </nav>
            </aside>
            <main class="book-main">
              <h1>書籍列表</h1>
              <p>商品卡片將於後續課程加入。</p>
            </main>
          </div>
        </div>
      </div>
      <footer>
        <div class="container">
          <div class="footer-inner">
            <nav class="footer-nav" aria-label="頁尾導覽">
              <a href="#">首頁</a>
              <a href="#">最新上架</a>
              <a href="#">暢銷排行</a>
              <a href="#">主題專區</a>
              <a href="#">會員中心</a>
            </nav>
            <p>Copyright 2025 電子商城版權所有</p>
          </div>
        </div>
      </footer>
    </section>
  </body>
</html>
